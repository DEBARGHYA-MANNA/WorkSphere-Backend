name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Validate application and OpenAPI startup
        run: node -e "const app = require('./src/app'); const spec = require('./src/config/swagger'); if (!app || !spec.paths['/organizations/{organizationId}/analytics']) process.exit(1)"
      - name: Audit dependencies
        run: npm audit --audit-level=high
